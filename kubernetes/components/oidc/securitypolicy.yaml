---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: ${APP}-auth
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ${APP}
  oidc:
    provider:
      issuer: https://login.chillincool.net/realms/chillincool
    clientID: ${APP}
    clientSecret:
      name: ${APP}-oidc-secret
    redirectURL: https://${APP}.chillincool.net/oauth2/callback
    forwardAccessToken: true
  jwt:
    providers:
      - name: keycloak
        issuer: https://login.chillincool.net/realms/chillincool
        remoteJWKS:
          uri: https://login.chillincool.net/realms/chillincool/protocol/openid-connect/certs
        claimToHeaders:
          - claim: preferred_username
            header: Remote-User
          - claim: email
            header: Remote-Email
  # Only users holding the app's own Keycloak client role "access" get in. The role arrives in
  # the ${APP}_roles claim from a client scope of the same name.
  authorization:
    defaultAction: Deny
    rules:
      - name: access
        action: Allow
        principal:
          jwt:
            provider: keycloak
            claims:
              - name: ${APP}_roles
                valueType: StringArray
                values:
                  - access
