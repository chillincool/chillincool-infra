---
# yaml-language-server: $schema=https://kubernetes-schemas-cvg.pages.dev/tailscale.com/connector_v1alpha1.json
# Subnet router: lets tailnet devices reach the home VLANs, including while using an exit node
apiVersion: tailscale.com/v1alpha1
kind: Connector
metadata:
  name: home-lan
spec:
  hostname: home-lan
  subnetRouter:
    advertiseRoutes:
      - 10.60.60.0/24
      - 172.16.60.0/24
      - 172.16.90.0/24
