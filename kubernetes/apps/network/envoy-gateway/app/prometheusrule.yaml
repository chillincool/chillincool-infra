---
# yaml-language-server: $schema=https://kubernetes-schemas-cvg.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: envoy-gateway-rules
spec:
  groups:
    - name: envoy-gateway.rules
      rules:
        # Clients are sending QUIC packets for connections Envoy doesn't know, which drops their HTTP/3 sessions
        - alert: EnvoyQUICStatelessResets
          expr: |-
            sum by (pod) (increase(envoy_listener_quic_dispatcher_stateless_reset_packets_sent[1h]))
              / sum by (pod) (increase(envoy_http_downstream_cx_http3_total{envoy_http_conn_manager_prefix="https-10443"}[1h])) > 0.25
          for: 15m
          annotations:
            summary: >-
              {{ $labels.pod }} reset {{ $value | humanizePercentage }} of its HTTP/3 connections in the last hour
          labels:
            severity: warning
