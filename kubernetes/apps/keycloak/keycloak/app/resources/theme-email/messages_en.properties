# Subjects and plain-text bodies; the HTML bodies are in executeActions.ftl and password-reset.ftl
executeActionsSubject=Your Chillincool account
executeActionsBody=Chris needs you to {3} for your Chillincool account. Open this link to do it:\n\n{0}\n\nThe link works for {4}. If it has expired, ask Chris to send a new one.\n\nWeren''t expecting this? You can ignore it and nothing will change.
passwordResetSubject=Reset your Chillincool password
passwordResetBody=Someone asked to reset the password for your Chillincool account. If that was you, open this link to choose a new one:\n\n{0}\n\nThe link works for {3}.\n\nDidn''t ask for this? You can ignore this email. Your password stays the same.

