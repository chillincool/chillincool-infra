---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./cluster.yaml
  - ./externalsecret.yaml
  - ./grafanadashboard.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./prometheusrule.yaml
  - ./scheduledbackup.yaml
configMapGenerator:
  - name: keycloak-realm
    files:
      - chillincool-realm.json=./resources/chillincool-realm.json
  - name: keycloak-theme
    files:
      - theme.properties=./resources/theme/theme.properties
      - chillincool.css=./resources/theme/chillincool.css
      - chillincool.js=./resources/theme/chillincool.js
      - logo.svg=./resources/theme/logo.svg
      - wear.svg=./resources/theme/wear.svg
      - outfit.woff2=./resources/theme/outfit.woff2
generatorOptions:
  disableNameSuffixHash: true
