---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./cluster.yaml
  - ./externalsecret.yaml
  - ./grafanadashboard.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./prometheusrule.yaml
  - ./scheduledbackup.yaml
configMapGenerator:
  - name: keycloak-theme
    files:
      - theme.properties=./resources/theme/theme.properties
      - chillincool.css=./resources/theme/chillincool.css
      - chillincool.js=./resources/theme/chillincool.js
      - logo.svg=./resources/theme/logo.svg
      - wear.svg=./resources/theme/wear.svg
      - outfit.woff2=./resources/theme/outfit.woff2
      - master-theme.properties=./resources/theme-master/theme.properties
      - master.css=./resources/theme-master/master.css
      - email-theme.properties=./resources/theme-email/theme.properties
      - email-template.ftl=./resources/theme-email/template.ftl
      - email-executeActions.ftl=./resources/theme-email/executeActions.ftl
      - email-password-reset.ftl=./resources/theme-email/password-reset.ftl
      - email-messages_en.properties=./resources/theme-email/messages_en.properties
      - account-theme.properties=./resources/theme-account/theme.properties
      - admin-theme.properties=./resources/theme-admin/theme.properties
      - admin.css=./resources/theme-admin/admin.css
      - admin.js=./resources/theme-admin/admin.js
      - console.css=./resources/theme-console/console.css
      - console.js=./resources/theme-console/console.js
generatorOptions:
  disableNameSuffixHash: true
