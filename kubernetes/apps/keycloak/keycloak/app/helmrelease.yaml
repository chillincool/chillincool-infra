---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak
spec:
  chartRef:
    kind: OCIRepository
    name: keycloak
  interval: 1h
  values:
    controllers:
      keycloak:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: quay.io/keycloak/keycloak
              tag: 26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
            args:
              - start
              - --import-realm
            env:
              # Database
              KC_DB: postgres
              KC_DB_URL_HOST: keycloak-db-rw.keycloak.svc.cluster.local
              KC_DB_URL_PORT: "5432"
              KC_DB_URL_DATABASE: keycloak
              # Keycloak
              # No fixed hostname: the master realm and admin console follow whichever host they are
              # opened on (login-admin.chillincool.net / .com). The chillincool realm is pinned to
              # https://login.chillincool.net by its own Frontend URL setting.
              KC_HOSTNAME_STRICT: "false"
              KC_HTTP_ENABLED: "true"
              KC_HTTP_PORT: &port 8080
              KC_HTTP_MANAGEMENT_PORT: &mgmt 9000
              KC_PROXY_HEADERS: xforwarded
              KC_HEALTH_ENABLED: "true"
              KC_METRICS_ENABLED: "true"
              KC_LOG_LEVEL: info
              KC_FEATURES: token-exchange,admin-fine-grained-authz
              # One replica, so no clustering. With the default clustered cache, each Recreate rollout
              # left the old pod in the jgroups_ping table and the new pod logged a split-brain error.
              KC_CACHE: local
              TZ: America/Chicago
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/live
                    port: *mgmt
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/ready
                    port: *mgmt
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/started
                    port: *mgmt
                  initialDelaySeconds: 15
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 25m
                memory: 775Mi
              limits:
                memory: 775Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
          management:
            port: *mgmt
    serviceMonitor:
      app:
        endpoints:
          - port: management
            path: /metrics
    route:
      keycloak:
        hostnames:
          - login.chillincool.net
        # Public, and also on the LAN so local logins don't go out through Cloudflare and back
        parentRefs:
          - name: envoy-external
            namespace: network
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          # The bare hostname lands on the chillincool realm
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /realms/chillincool/account/
                  statusCode: 302
            matches:
              - path:
                  type: Exact
                  value: /
          # The admin console and the master realm are not served publicly (see login-admin below)
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /realms/chillincool/account/
                  statusCode: 302
            matches:
              - path:
                  type: PathPrefix
                  value: /admin
              - path:
                  type: PathPrefix
                  value: /realms/master
          - backendRefs:
              - identifier: app
                port: *port
      tailscale:
        annotations:
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - login.chillincool.com
        parentRefs:
          - name: envoy-tailscale
            namespace: network
        rules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /realms/chillincool/account/
                  statusCode: 302
            matches:
              - path:
                  type: Exact
                  value: /
          - backendRefs:
              - identifier: app
                port: *port
      # Admin console and master realm: LAN only
      admin:
        annotations:
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - login-admin.chillincool.net
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /admin/master/console/
                  statusCode: 302
            matches:
              - path:
                  type: Exact
                  value: /
          - backendRefs:
              - identifier: app
                port: *port
      # Admin console and master realm: tailnet only
      admin-tailscale:
        annotations:
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - login-admin.chillincool.com
        parentRefs:
          - name: envoy-tailscale
            namespace: network
        rules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /admin/master/console/
                  statusCode: 302
            matches:
              - path:
                  type: Exact
                  value: /
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      tmp:
        type: emptyDir
      realm-config:
        type: configMap
        name: "{{ .Release.Name }}-realm"
        globalMounts:
          - path: /opt/keycloak/data/import
      # Custom themes, selected under Realm settings -> Themes: login "chillincool" and "chillincool-master",
      # email, account and admin "chillincool" (the admin theme is picked in the master realm)
      theme:
        type: configMap
        name: "{{ .Release.Name }}-theme"
        globalMounts:
          - path: /opt/keycloak/themes/chillincool/login/theme.properties
            subPath: theme.properties
          - path: /opt/keycloak/themes/chillincool/login/resources/css/chillincool.css
            subPath: chillincool.css
          - path: /opt/keycloak/themes/chillincool/login/resources/js/chillincool.js
            subPath: chillincool.js
          - path: /opt/keycloak/themes/chillincool/login/resources/img/logo.svg
            subPath: logo.svg
          - path: /opt/keycloak/themes/chillincool/login/resources/img/wear.svg
            subPath: wear.svg
          - path: /opt/keycloak/themes/chillincool/login/resources/fonts/outfit.woff2
            subPath: outfit.woff2
          - path: /opt/keycloak/themes/chillincool-master/login/theme.properties
            subPath: master-theme.properties
          - path: /opt/keycloak/themes/chillincool-master/login/resources/css/master.css
            subPath: master.css
          - path: /opt/keycloak/themes/chillincool/email/theme.properties
            subPath: email-theme.properties
          - path: /opt/keycloak/themes/chillincool/email/html/template.ftl
            subPath: email-template.ftl
          - path: /opt/keycloak/themes/chillincool/email/html/executeActions.ftl
            subPath: email-executeActions.ftl
          - path: /opt/keycloak/themes/chillincool/email/html/password-reset.ftl
            subPath: email-password-reset.ftl
          - path: /opt/keycloak/themes/chillincool/email/messages/messages_en.properties
            subPath: email-messages_en.properties
          - path: /opt/keycloak/themes/chillincool/account/theme.properties
            subPath: account-theme.properties
          - path: /opt/keycloak/themes/chillincool/account/resources/css/console.css
            subPath: console.css
          - path: /opt/keycloak/themes/chillincool/account/resources/js/console.js
            subPath: console.js
          - path: /opt/keycloak/themes/chillincool/account/resources/js/chillincool.js
            subPath: chillincool.js
          - path: /opt/keycloak/themes/chillincool/account/resources/img/logo.svg
            subPath: logo.svg
          - path: /opt/keycloak/themes/chillincool/account/resources/fonts/outfit.woff2
            subPath: outfit.woff2
          - path: /opt/keycloak/themes/chillincool/admin/theme.properties
            subPath: admin-theme.properties
          - path: /opt/keycloak/themes/chillincool/admin/resources/css/console.css
            subPath: console.css
          - path: /opt/keycloak/themes/chillincool/admin/resources/css/admin.css
            subPath: admin.css
          - path: /opt/keycloak/themes/chillincool/admin/resources/js/console.js
            subPath: console.js
          - path: /opt/keycloak/themes/chillincool/admin/resources/js/admin.js
            subPath: admin.js
          - path: /opt/keycloak/themes/chillincool/admin/resources/js/chillincool.js
            subPath: chillincool.js
          - path: /opt/keycloak/themes/chillincool/admin/resources/img/logo.svg
            subPath: logo.svg
          - path: /opt/keycloak/themes/chillincool/admin/resources/fonts/outfit.woff2
            subPath: outfit.woff2
