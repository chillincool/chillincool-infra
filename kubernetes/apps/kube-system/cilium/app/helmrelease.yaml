---
# yaml-language-server: $schema=https://kubernetes-schemas-cvg.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  chartRef:
    kind: OCIRepository
    name: cilium
  interval: 1h
  values:
    autoDirectNodeRoutes: true
    bandwidthManager:
      enabled: true
      bbr: true
    bpf:
      datapathMode: netkit
      masquerade: true
      preallocateMaps: true
    bpfClockProbe: true
    bgpControlPlane:
      enabled: true
    cgroup:
      automount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    cni:
      exclusive: false
    dashboards:
      enabled: true
    devices: eno1 ens18
    directRoutingDevice: eno1 ens18
    egressGateway:
      enabled: true
    # BIG TCP cannot be combined with the tunneling the egress gateway uses
    enableIPv4BIGTCP: false
    endpointRoutes:
      enabled: true
    envoy:
      enabled: false
    hubble:
      enabled: true
      # Flow log for traffic crossing the cluster boundary, so an IP seen by Security Onion can be mapped to a pod.
      # qbittorrent/slskd are excluded: they have fixed egress IPs and would be most of the volume.
      export:
        dynamic:
          enabled: true
          config:
            content:
              - name: boundary
                filePath: /var/run/cilium/hubble/events.log
                fieldMask:
                  - time
                  - verdict
                  - source.namespace
                  - source.pod_name
                  - destination.namespace
                  - destination.pod_name
                  - IP
                  - l4
                  - traffic_direction
                  - is_reply
                includeFilters:
                  - source_label: ["reserved:world"]
                  - destination_label: ["reserved:world"]
                excludeFilters:
                  - source_pod: ["media/qbittorrent", "media/slskd"]
                  - destination_pod: ["media/qbittorrent", "media/slskd"]
                fileMaxSizeMb: 20
                fileMaxBackups: 2
    ipam:
      mode: kubernetes
    # Destinations listed here keep the pod's own source IP. With 0.0.0.0/0 nothing is masqueraded to the
    # node IP: pod IPs are routable (pod CIDR is advertised over BGP) and the FortiGate does the internet NAT.
    ipMasqAgent:
      enabled: true
      config:
        nonMasqueradeCIDRs:
          - 0.0.0.0/0
    ipv4NativeRoutingCIDR: 10.42.0.0/16
    k8sServiceHost: 127.0.0.1
    k8sServicePort: 7445
    kubeProxyReplacement: true
    kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
    l2announcements:
      enabled: false
    loadBalancer:
      algorithm: maglev
      mode: dsr
      serviceTopology: true
    localRedirectPolicies:
      enabled: true
    operator:
      dashboards:
        enabled: true
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
      replicas: 1
      rollOutPods: true
    pmtuDiscovery:
      enabled: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true
    rollOutCiliumPods: true
    routingMode: native
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - PERFMON
          - BPF
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    socketLB:
      enabled: true
      hostNamespaceOnly: false
