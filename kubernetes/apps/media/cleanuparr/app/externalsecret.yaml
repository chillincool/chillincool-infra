---
# yaml-language-server: $schema=https://kubernetes-schemas-cvg.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cleanuparr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cleanuparr-secret
    template:
      data:
        CLEANUPARR_API_KEY: "{{ .CLEANUPARR_API_KEY }}"
  dataFrom:
    - extract:
        key: cleanuparr
