---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: storyteller
spec:
  chartRef:
    kind: OCIRepository
    name: storyteller
  interval: 1h
  values:
    controllers:
      storyteller:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: registry.gitlab.com/storyteller-platform/storyteller
              tag: web-v2.14.23@sha256:1ae16005572519f56abac2d65ab879d20115cd257fde7e89cf739ea82aed4de3
            env:
              TZ: America/Chicago
              PORT: &port 8001
              # The entrypoint refuses to start as non-root (it wants to chown and gosu
              # itself) unless this is set
              FORCE_USER_SETTING: "1"
              AUTH_URL: https://storyteller.chillincool.net/api/v2/auth
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            # Root filesystem stays writable: whisper models download into
            # $HOME/.local/share/ghost-story next to the binaries baked into the image
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              # Upstream asks for 8 GB while transcribing; idle is ~350 MiB
              limits:
                memory: 8Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: storyteller
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.chillincool.net"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      media:
        type: nfs
        server: dsm1.chillincool.net
        path: /volume2/data
        globalMounts:
          - path: /media
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
