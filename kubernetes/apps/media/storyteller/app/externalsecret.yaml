---
# yaml-language-server: $schema=https://kubernetes-schemas-cvg.pages.dev/external-secrets.io/externalsecret_v1.json
# 1Password item "storyteller" needs: STORYTELLER_SECRET_KEY (openssl rand -base64 32)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: storyteller
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: storyteller-secret
    template:
      data:
        STORYTELLER_SECRET_KEY: "{{ .STORYTELLER_SECRET_KEY }}"
  dataFrom:
    - extract:
        key: storyteller
