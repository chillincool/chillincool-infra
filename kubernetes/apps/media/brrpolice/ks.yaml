---
# yaml-language-server: $schema=https://kubernetes-schemas-cvg.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: brrpolice
spec:
  components:
    - ../../../../components/volsync
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
    - name: qui
      namespace: media
  interval: 1h
  path: ./kubernetes/apps/media/brrpolice/app
  postBuild:
    substitute:
      APP: brrpolice
      VOLSYNC_CAPACITY: 1Gi
      VOLSYNC_SCHEDULE: "42 7 * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  wait: false
