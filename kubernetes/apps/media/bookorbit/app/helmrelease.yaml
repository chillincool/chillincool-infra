---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bookorbit
spec:
  chartRef:
    kind: OCIRepository
    name: bookorbit
  interval: 1h
  values:
    controllers:
      bookorbit:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/bookorbit/bookorbit
              tag: 3.6.0@sha256:bbb5da52e96dbbff1dd36f55454f9845e6cde264b4b3428a3ea783124a4ca62e
            env:
              TZ: America/Chicago
              NODE_ENV: production
              PORT: &port 3000
              APP_URL: https://bookorbit.chillincool.net
              LIBRARY_BROWSE_ROOT: /media/media
              BOOK_DOCK_PATH: /media/media/book-import
              NODE_MAX_OLD_SPACE_SIZE: "2048"
              OIDC_ALLOW_LOCAL_ISSUERS: true
              DISABLE_LOCAL_AUTH: true
              LOG_LEVEL: debug
              PUID: "1000"
              PGID: "1000"
              BOOKORBIT_FIX_PERMISSIONS: "false"
              # Sidecar below; READ_ALOUD_WORKER_TOKEN comes from the secret
              READ_ALOUD_WORKER_URL: http://localhost:8787
              # Database
              POSTGRES_HOST: bookorbit-db-rw
              POSTGRES_PORT: "5432"
              POSTGRES_DB: bookorbit
              POSTGRES_USER: bookorbit
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: bookorbit-db-secret
                    key: password
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi
          read-aloud-worker:
            image:
              repository: ghcr.io/bookorbit/bookorbit-read-aloud-worker
              tag: 3.6.0@sha256:4ca7f141f346365af8970809f7fb3947c309082c81b5b00cee0cdec5ed6c5f96
            env:
              TZ: America/Chicago
              READ_ALOUD_LIBRARY_ROOTS: /media/media
              READ_ALOUD_WORK_ROOT: /data/read-aloud/jobs
              READ_ALOUD_CTC_DEVICE: cpu
              READ_ALOUD_WORKER_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-secret"
                    key: READ_ALOUD_WORKER_TOKEN
            # /health needs the token, so probe the port
            probes:
              liveness: &workerProbes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8787
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *workerProbes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              # Transcription takes every core it can see; without a cap it starves the node
              limits:
                cpu: 8
                memory: 4Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: bookorbit
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.chillincool.net"
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          bookorbit:
            app:
              - path: /data
            # The worker sees only the server's <APP_DATA_PATH>/read-aloud
            read-aloud-worker:
              - path: /data/read-aloud
                subPath: read-aloud
      media:
        type: nfs
        server: dsm1.chillincool.net
        path: /volume2/data
        advancedMounts:
          bookorbit:
            app:
              - path: /media
            # Same path as the app; the worker resolves book files by the server's paths
            read-aloud-worker:
              - path: /media
                readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
