---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bookorbit
spec:
  chartRef:
    kind: OCIRepository
    name: bookorbit
  interval: 1h
  values:
    controllers:
      bookorbit:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/bookorbit/bookorbit
              tag: 3.8.0@sha256:d318f7732f6f6330312e2c5f854f7899f858b54cc4b18a13cde1f43b5bea0515
            env:
              TZ: America/Chicago
              NODE_ENV: production
              PORT: &port 3000
              APP_URL: https://bookorbit.chillincool.net
              LIBRARY_BROWSE_ROOT: /media/media
              BOOK_DOCK_PATH: /media/media/book-import
              NODE_MAX_OLD_SPACE_SIZE: "2048"
              OIDC_ALLOW_LOCAL_ISSUERS: true
              DISABLE_LOCAL_AUTH: true
              LOG_LEVEL: debug
              PUID: "1000"
              PGID: "1000"
              BOOKORBIT_FIX_PERMISSIONS: "false"
              # Sidecar below; READ_ALOUD_WORKER_TOKEN comes from the secret
              READ_ALOUD_WORKER_URL: http://localhost:8787
              # Database
              POSTGRES_HOST: bookorbit-db-rw
              POSTGRES_PORT: "5432"
              POSTGRES_DB: bookorbit
              POSTGRES_USER: bookorbit
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: bookorbit-db-secret
                    key: password
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi
          read-aloud-worker:
            image:
              repository: ghcr.io/bookorbit/bookorbit-read-aloud-worker
              tag: 3.7.0@sha256:451dad18a5772716b3383552c40ac329836178a48058cdee6a31c3051569dc4f
            env:
              TZ: America/Chicago
              READ_ALOUD_LIBRARY_ROOTS: /media/media
              READ_ALOUD_WORK_ROOT: /data/read-aloud/jobs
              READ_ALOUD_CTC_DEVICE: cpu
              READ_ALOUD_WORKER_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-secret"
                    key: READ_ALOUD_WORKER_TOKEN
            # /health needs the token, so probe the port
            probes:
              liveness: &workerProbes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8787
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *workerProbes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              # Transcription takes every core it can see; without a cap it starves the node
              limits:
                cpu: 8
                memory: 4Gi
      # Manga metadata provider; add in BookOrbit as http://bookorbit-mangabaka:8080
      mangabaka:
        containers:
          app:
            image:
              repository: ghcr.io/bookorbit/mangabaka-provider
              tag: 0.1.0@sha256:c9471def1965232be7934df81b0e8a4df1b9b471b92e74c378622490c6d34742
            env:
              TZ: America/Chicago
            probes:
              liveness: &mangabakaProbes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8080
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *mangabakaProbes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: bookorbit
        ports:
          http:
            port: *port
      mangabaka:
        controller: mangabaka
        ports:
          http:
            port: 8080
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.chillincool.net"
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - name: bookorbit-app
                port: *port
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          bookorbit:
            app:
              - path: /data
            # The worker sees only the server's <APP_DATA_PATH>/read-aloud
            read-aloud-worker:
              - path: /data/read-aloud
                subPath: read-aloud
      media:
        type: nfs
        server: dsm1.chillincool.net
        path: /volume2/data
        advancedMounts:
          bookorbit:
            app:
              - path: /media
            # Same path as the app; the worker resolves book files by the server's paths
            read-aloud-worker:
              - path: /media
                readOnly: true
      # Job scratch runs to ~30GB per audiobook; own volume so it skips VolSync but can resume
      read-aloud:
        existingClaim: "{{ .Release.Name }}-read-aloud"
        advancedMounts:
          bookorbit:
            app:
              - path: /data/read-aloud/jobs
                subPath: jobs
              - path: /data/read-aloud/tmp
                subPath: tmp
            read-aloud-worker:
              - path: /data/read-aloud/jobs
                subPath: jobs
              - path: /data/read-aloud/tmp
                subPath: tmp
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
