---
# yaml-language-server: $schema=https://kubernetes-schemas-cvg.pages.dev/external-secrets.io/externalsecret_v1.json
# 1Password item "bookorbit" needs: JWT_SECRET, SETUP_BOOTSTRAP_TOKEN, EMAIL_ENCRYPTION_KEY,
# MIGRATION_ENCRYPTION_KEY, POSTGRES_PASSWORD, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookorbit
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: bookorbit-secret
    template:
      data:
        JWT_SECRET: "{{ .JWT_SECRET }}"
        SETUP_BOOTSTRAP_TOKEN: "{{ .SETUP_BOOTSTRAP_TOKEN }}"
        EMAIL_ENCRYPTION_KEY: "{{ .EMAIL_ENCRYPTION_KEY }}"
        MIGRATION_ENCRYPTION_KEY: "{{ .MIGRATION_ENCRYPTION_KEY }}"
  dataFrom:
    - extract:
        key: bookorbit
---
# yaml-language-server: $schema=https://kubernetes-schemas-cvg.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookorbit-db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: bookorbit-db-secret
    template:
      data:
        username: bookorbit
        password: "{{ .POSTGRES_PASSWORD }}"
  dataFrom:
    - extract:
        key: bookorbit
---
# yaml-language-server: $schema=https://kubernetes-schemas-cvg.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookorbit-r2
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: bookorbit-r2-secret
    template:
      data:
        R2_ACCESS_KEY_ID: "{{ .R2_ACCESS_KEY_ID }}"
        R2_SECRET_ACCESS_KEY: "{{ .R2_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: bookorbit
