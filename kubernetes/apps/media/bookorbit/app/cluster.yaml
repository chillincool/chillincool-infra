---
# yaml-language-server: $schema=https://kubernetes-schemas-cvg.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bookorbit-db
spec:
  instances: 1
  # BookOrbit upstream runs pgvector/pgvector:pg18
  imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie
  primaryUpdateStrategy: unsupervised
  storage:
    size: 10Gi
    storageClass: longhorn
  postgresql:
    # pgvector as an extension image (CNPG >= 1.27 + ImageVolume; k8s is v1.35 here)
    extensions:
      - name: pgvector
        image:
          reference: ghcr.io/cloudnative-pg/pgvector:0.8.1-18-trixie
  monitoring:
    enablePodMonitor: true
  bootstrap:
    initdb:
      database: bookorbit
      owner: bookorbit
      secret:
        name: bookorbit-db-secret
      # BookOrbit requires uuid-ossp, pg_trgm and vector
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
        - CREATE EXTENSION IF NOT EXISTS pg_trgm;
        - CREATE EXTENSION IF NOT EXISTS vector;
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 1Gi
  backup:
    barmanObjectStore:
      destinationPath: s3://bookorbit-db
      endpointURL: https://80035b568c77008106a1c2320cb9b69d.r2.cloudflarestorage.com
      s3Credentials:
        accessKeyId:
          name: bookorbit-r2-secret
          key: R2_ACCESS_KEY_ID
        secretAccessKey:
          name: bookorbit-r2-secret
          key: R2_SECRET_ACCESS_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "7d"
