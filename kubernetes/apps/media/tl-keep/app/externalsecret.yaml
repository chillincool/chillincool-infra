---
# yaml-language-server: $schema=https://kubernetes-schemas-cvg.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tl-keep
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: tl-keep-secret
    template:
      data:
        # qBittorrent is reached through qui's client proxy; the proxy key is part of the URL
        QBITTORRENT_URL: "http://qui.media.svc.cluster.local/proxy/{{ .QUI_PROXY_KEY }}"
  dataFrom:
    - extract:
        key: tl-keep
