---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
configMapGenerator:
  - name: tl-keep-configmap
    files:
      - tl-keep.py=./resources/tl-keep.py
generatorOptions:
  disableNameSuffixHash: true
