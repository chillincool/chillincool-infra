---
# yaml-language-server: $schema=https://kubernetes-schemas-cvg.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookboss
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: bookboss-secret
    template:
      data:
        BOOKBOSS__ENCRYPTION_SECRET: "{{ .BOOKBOSS_ENCRYPTION_SECRET }}"
        BOOKBOSS__OIDC__CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
        # Without a Hardcover token Open Library is the only metadata source, and it
        # copies every library "subject" into the book's genres
        BOOKBOSS__METADATA__HARDCOVER_API_TOKEN: "{{ .HARDCOVER_API_TOKEN }}"
        BOOKBOSS__METADATA__GOOGLEBOOKS_API_TOKEN: "{{ .GOOGLEBOOKS_API_TOKEN}}"
  dataFrom:
    - extract:
        key: bookboss
