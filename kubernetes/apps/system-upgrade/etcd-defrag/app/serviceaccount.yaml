---
# Talos API credentials for the CronJob, written by Talos into a Secret of the same name.
# Talos only allows os:admin for pods in this namespace (machine config kubernetesTalosAPIAccess).
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: etcd-defrag-talosconfig
spec:
  roles:
    - os:admin
