---
# yaml-language-server: $schema=https://kubernetes-schemas-cvg.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tilegate
spec:
  components:
    - ../../../../components/oidc
  dependsOn:
    - name: cloudnative-pg
      namespace: cloudnative-pg
    - name: longhorn
      namespace: longhorn-system
  interval: 1h
  path: ./kubernetes/apps/util/tilegate/app
  # Every user may open tilegate; it only shows tiles for apps they hold a role on,
  # so drop the oidc component's tilegate_roles check
  patches:
    - patch: |-
        - op: remove
          path: /spec/authorization
      target:
        group: gateway.envoyproxy.io
        kind: SecurityPolicy
  postBuild:
    substitute:
      APP: tilegate
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: util
  wait: false
