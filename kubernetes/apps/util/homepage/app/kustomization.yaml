---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
configMapGenerator:
  - name: homepage-config
    files:
      - settings.yaml=./resources/settings.yaml
      - services.yaml=./resources/services.yaml
      - widgets.yaml=./resources/widgets.yaml
      - custom.css=./resources/custom.css
  - name: homepage-assets
    files:
      # .bin because Flux's source controller skips *.jpg/*.png by default
      - background.jpg=./resources/background.jpg.bin
      - logo.svg=./resources/logo.svg
      - outfit.woff2=./resources/outfit.woff2
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
