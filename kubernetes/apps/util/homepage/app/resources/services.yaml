---
# https://gethomepage.dev/configs/services/
# Icons by name come from https://dashboardicons.com; mdi-* are Material Design icons.
# Widgets call the apps' in-cluster addresses with API keys from homepage-secret.
- Upcoming:
    - Calendar:
        icon: mdi-calendar-month
        widget:
          type: calendar
          view: agenda
          maxEvents: 12
          showTime: true
          # Reuses the Sonarr and Radarr widgets' keys and addresses
          integrations:
            - type: sonarr
              service_group: Downloads
              service_name: Sonarr
            - type: sonarr
              service_group: Downloads
              service_name: Sonarr Anime
            - type: radarr
              service_group: Downloads
              service_name: Radarr

- Media:
    - Plex:
        href: https://plex.chillincool.net
        icon: plex.svg
        description: Movies and TV
        widget:
          type: plex
          url: http://plex.media.svc.cluster.local:32400
          key: "{{HOMEPAGE_VAR_PLEX_TOKEN}}"
    - Seerr:
        href: https://requests.chillincool.net
        icon: overseerr.svg
        description: Requests
        widget:
          type: jellyseerr
          url: http://seerr.media.svc.cluster.local
          key: "{{HOMEPAGE_VAR_SEERR_API_KEY}}"
    - Tautulli:
        href: https://tautulli.chillincool.net
        icon: tautulli.svg
        description: Plex stats
        widget:
          type: tautulli
          url: http://tautulli.media.svc.cluster.local
          key: "{{HOMEPAGE_VAR_TAUTULLI_API_KEY}}"
    - Audiobookshelf:
        href: https://audiobookshelf.chillincool.net
        icon: audiobookshelf.svg
        description: Audiobooks
        # API token of a homepage user with no permissions
        widget:
          type: audiobookshelf
          url: http://audiobookshelf.media.svc.cluster.local
          key: "{{HOMEPAGE_VAR_ABS_API_KEY}}"
    - BookBoss:
        href: https://bookboss.chillincool.net
        icon: mdi-book-open-page-variant
        description: Ebooks
    - Navidrome:
        href: https://navidrome.chillincool.net
        icon: navidrome.svg
        description: Music
        # Subsonic token of a non-admin homepage user: md5(password + salt)
        widget:
          type: navidrome
          url: http://navidrome.media.svc.cluster.local
          user: homepage
          token: "{{HOMEPAGE_VAR_NAVIDROME_TOKEN}}"
          salt: "{{HOMEPAGE_VAR_NAVIDROME_SALT}}"

- Downloads:
    - Sonarr:
        href: https://sonarr.chillincool.net
        icon: sonarr.svg
        widget:
          type: sonarr
          url: http://sonarr.media.svc.cluster.local
          key: "{{HOMEPAGE_VAR_SONARR_API_KEY}}"
    - Sonarr 4K:
        href: https://sonarr-4k.chillincool.net
        icon: sonarr.svg
        widget:
          type: sonarr
          url: http://sonarr-4k.media.svc.cluster.local
          key: "{{HOMEPAGE_VAR_SONARR_4K_API_KEY}}"
    - Sonarr Anime:
        href: https://sonarr-anime.chillincool.net
        icon: sonarr.svg
        widget:
          type: sonarr
          url: http://sonarr-anime.media.svc.cluster.local
          key: "{{HOMEPAGE_VAR_SONARR_ANIME_API_KEY}}"
    - Prowlarr:
        href: https://prowlarr.chillincool.net
        icon: prowlarr.svg
        widget:
          type: prowlarr
          url: http://prowlarr.media.svc.cluster.local
          key: "{{HOMEPAGE_VAR_PROWLARR_API_KEY}}"
    - Radarr:
        href: https://radarr.chillincool.net
        icon: radarr.svg
        widget:
          type: radarr
          url: http://radarr.media.svc.cluster.local
          key: "{{HOMEPAGE_VAR_RADARR_API_KEY}}"
    - Radarr 4K:
        href: https://radarr-4k.chillincool.net
        icon: radarr.svg
        widget:
          type: radarr
          url: http://radarr-4k.media.svc.cluster.local
          key: "{{HOMEPAGE_VAR_RADARR_4K_API_KEY}}"
    - qui:
        href: https://qui.chillincool.net
        icon: qbittorrent.svg
        description: qBittorrent
        widget:
          type: qbittorrent
          url: http://qbittorrent.media.svc.cluster.local
          # qBittorrent skips its login for in-cluster requests
          username: ""
          password: ""
    - autobrr:
        href: https://autobrr.chillincool.net
        icon: autobrr.svg
    - Shelfmark:
        href: https://shelfmark.chillincool.net
        icon: mdi-bookshelf
        description: Book requests
    - slskd:
        href: https://slskd.chillincool.net
        icon: slskd.svg
        description: Soulseek
    - wrtag:
        href: https://wrtag.chillincool.net
        icon: mdi-music-box-multiple
        description: Music tagging
    - Cleanuparr:
        href: https://cleanuparr.chillincool.net
        icon: mdi-broom
    - Maintainerr:
        href: https://maintainerr.chillincool.net
        icon: maintainerr.svg
    - Agregarr:
        href: https://agregarr.chillincool.net
        icon: mdi-playlist-star
        description: Plex collections

- Home:
    - Immich:
        href: https://immich.chillincool.net
        icon: immich.svg
        description: Photos
        # API key limited to the server.statistics permission
        widget:
          type: immich
          url: http://immich-server.util.svc.cluster.local:2283
          key: "{{HOMEPAGE_VAR_IMMICH_API_KEY}}"
          version: 2
    - Paperless:
        href: https://paperless.chillincool.net
        icon: paperless-ngx.svg
        description: Documents
        # Token of a homepage user with only the global statistics permission
        widget:
          type: paperlessngx
          url: http://paperless-ngx.util.svc.cluster.local
          key: "{{HOMEPAGE_VAR_PAPERLESS_API_KEY}}"
    - Firefly III:
        href: https://firefly-iii.chillincool.net
        icon: firefly-iii.svg
        description: Finances
    - IRC:
        href: https://irc.chillincool.net
        icon: mdi-pound
        description: gamja + soju

- Infrastructure:
    - Proxmox:
        href: https://pve1.chillincool.net
        icon: proxmox.svg
        # Read-only API token: homepage@pve has PVEAuditor on /
        widget:
          type: proxmox
          url: https://pve1.chillincool.net
          username: homepage@pve!homepage
          password: "{{HOMEPAGE_VAR_PVE_API_KEY}}"
          node: pve1
    - Synology:
        href: https://dsm1.chillincool.net
        icon: synology.svg
    - FortiGate:
        href: https://fw.chillincool.net
        icon: fortinet.svg
    - Keycloak:
        href: https://login-admin.chillincool.net
        icon: keycloak.svg
        description: Admin console
    - Grafana:
        href: https://grafana.chillincool.net
        icon: grafana.svg
    - Prometheus:
        href: https://prometheus.chillincool.net
        icon: prometheus.svg
        widget:
          type: prometheus
          url: http://prometheus-operated.observability.svc.cluster.local:9090
    - Alertmanager:
        href: https://alertmanager.chillincool.net
        icon: alertmanager.svg
    - VictoriaLogs:
        href: https://victoria-logs.chillincool.net
        icon: victoriametrics.svg
    - Flux:
        href: https://flux-operator.chillincool.net
        icon: flux-cd.svg
    - Gatus:
        href: https://status.chillincool.net
        icon: gatus.svg
        description: Status
        widget:
          type: gatus
          url: http://gatus.observability.svc.cluster.local
    - Kopia:
        href: https://kopia.chillincool.net
        icon: kopia.svg
        description: Backups
    - Goldilocks:
        href: https://goldilocks.chillincool.net
        icon: mdi-chart-box-outline
        description: Resource advice
