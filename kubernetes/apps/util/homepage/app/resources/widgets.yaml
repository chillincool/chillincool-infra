---
# https://gethomepage.dev/widgets/
- greeting:
    text_size: xl
    text: CHILLINCOOL
# Node CPU and memory, through the read-only ClusterRole in rbac.yaml
- kubernetes:
    cluster:
      show: true
      cpu: true
      memory: true
      showLabel: true
      label: cluster
    nodes:
      show: false
# Longhorn disk usage; its address is under providers in settings.yaml
# Single node, so the node entry already is the total
- longhorn:
    expanded: true
    total: false
    labels: true
    nodes: true
- datetime:
    text_size: md
    format:
      dateStyle: long
      timeStyle: short
      hourCycle: h23
