---
# yaml-language-server: $schema=https://kubernetes-schemas-cvg.pages.dev/external-secrets.io/externalsecret_v1.json
# API keys for the service widgets, from the apps' own 1Password items. Homepage reads
# HOMEPAGE_VAR_* environment variables as {{HOMEPAGE_VAR_*}} in services.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homepage-secret
    template:
      data:
        HOMEPAGE_VAR_SONARR_API_KEY: "{{ .SONARR_API_KEY }}"
        HOMEPAGE_VAR_SONARR_4K_API_KEY: "{{ .SONARR_4K_API_KEY }}"
        HOMEPAGE_VAR_SONARR_ANIME_API_KEY: "{{ .SONARR_ANIME_API_KEY }}"
        HOMEPAGE_VAR_RADARR_API_KEY: "{{ .RADARR_API_KEY }}"
        HOMEPAGE_VAR_RADARR_4K_API_KEY: "{{ .RADARR_4K_API_KEY }}"
        HOMEPAGE_VAR_PROWLARR_API_KEY: "{{ .PROWLARR_API_KEY }}"
        HOMEPAGE_VAR_SEERR_API_KEY: "{{ .SEERR_API_KEY }}"
        HOMEPAGE_VAR_TAUTULLI_API_KEY: "{{ .TAUTULLI_API_KEY }}"
        HOMEPAGE_VAR_PLEX_TOKEN: "{{ .PLEX_TOKEN }}"
        HOMEPAGE_VAR_PVE_API_KEY: "{{ .PVE_API_KEY }}"
        HOMEPAGE_VAR_IMMICH_API_KEY: "{{ .IMMICH_API_KEY }}"
        HOMEPAGE_VAR_ABS_API_KEY: "{{ .ABS_API_KEY }}"
        HOMEPAGE_VAR_PAPERLESS_API_KEY: "{{ .PAPERLESS_API_KEY }}"
        HOMEPAGE_VAR_NAVIDROME_SALT: "{{ .NAVIDROME_SALT }}"
        HOMEPAGE_VAR_NAVIDROME_TOKEN: "{{ .NAVIDROME_TOKEN }}"
  dataFrom:
    - extract:
        key: sonarr
    - extract:
        key: sonarr-4k
    - extract:
        key: sonarr-anime
    - extract:
        key: radarr
    - extract:
        key: radarr-4k
    - extract:
        key: prowlarr
    - extract:
        key: seerr
    - extract:
        key: tautulli
    - extract:
        key: plex
    - extract:
        key: homepage
