---
# yaml-language-server: $schema=https://kubernetes-schemas-cvg.pages.dev/postgresql.cnpg.io/scheduledbackup_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: firefly-iii-db
spec:
  # CNPG cron has a seconds field; UTC: 01:10 Chicago
  schedule: "0 10 6 * * *"
  backupOwnerReference: self
  cluster:
    name: firefly-iii-db
