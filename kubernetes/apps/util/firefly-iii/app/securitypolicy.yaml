---
# yaml-language-server: $schema=https://kubernetes-schemas-cvg.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
# Firefly III trusts the Remote-User header, so the tailscale route needs the same login as the
# internal one. The oidc component only covers the route named after the app.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: firefly-iii-tailscale-auth
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: firefly-iii-tailscale
  oidc:
    provider:
      issuer: https://login.chillincool.net/realms/chillincool
    clientID: firefly-iii
    clientSecret:
      name: firefly-iii-oidc-secret
    redirectURL: https://firefly-iii.chillincool.com/oauth2/callback
    forwardAccessToken: true
  jwt:
    providers:
      - name: keycloak
        issuer: https://login.chillincool.net/realms/chillincool
        remoteJWKS:
          uri: https://login.chillincool.net/realms/chillincool/protocol/openid-connect/certs
        claimToHeaders:
          - claim: preferred_username
            header: Remote-User
          - claim: email
            header: Remote-Email
  # Same role check as the oidc component
  authorization:
    defaultAction: Deny
    rules:
      - name: access
        action: Allow
        principal:
          jwt:
            provider: keycloak
            claims:
              - name: firefly-iii_roles
                valueType: StringArray
                values:
                  - access
