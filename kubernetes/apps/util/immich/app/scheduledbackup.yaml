---
# yaml-language-server: $schema=https://kubernetes-schemas-cvg.pages.dev/postgresql.cnpg.io/scheduledbackup_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: immich-db
spec:
  # CNPG cron has a seconds field; UTC: 01:15 Chicago
  schedule: "0 15 6 * * *"
  backupOwnerReference: self
  cluster:
    name: immich-db
