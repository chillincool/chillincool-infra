---
# yaml-language-server: $schema=https://kubernetes-schemas-cvg.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: soju
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: soju-secret
    template:
      data:
        # soju only reads its settings from a file, and the OIDC client secret is part of the auth URL
        soju-config: |
          db sqlite3 /db/main.db
          message-store db
          listen http+insecure://:8080
          listen unix+admin:///run/soju/admin.sock
          hostname irc.chillincool.net
          title chillincool
          http-ingress https://irc.chillincool.net
          auth oauth2 https://soju:{{ .SOJU_OIDC_CLIENT_SECRET | urlquery }}@login.chillincool.net/realms/chillincool
  dataFrom:
    - extract:
        key: soju
