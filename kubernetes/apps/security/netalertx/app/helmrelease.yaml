---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netalertx
spec:
  chartRef:
    kind: OCIRepository
    name: netalertx
  interval: 1h
  values:
    controllers:
      netalertx:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/netalertx/netalertx
              tag: 26.10.0@sha256:f95bca7a794141296dd1d16be5bb7f39f6fdbcd20353cdb51eee696e12d317f6
            env:
              # Layer-2 scanners (ARPSCAN, AVAHISCAN, NBTSCAN) need hostNetwork - SNMPDSC covers discovery instead
              LOADED_PLUGINS: "['SNMPDSC', 'CSVBCKP', 'DBCLNP', 'DIGSCAN', 'INTRNT', 'MAINT', 'NEWDEV', 'NSLOOKUP', 'NTFPRCS', 'SETPWD', 'SMTP', 'SYNC', 'VNDRPDT', 'WORKFLOWS', 'UI']"
              PORT: &port 20211
              SNMPCONFPATH: /etc/snmp-netalertx
              TZ: America/Chicago
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              # python3 in the image has file caps (+eip) and won't exec unless these are in the bounding set
              capabilities: {drop: ["ALL"], add: ["NET_ADMIN", "NET_RAW"]}
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.chillincool.net"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      snmp-conf:
        type: secret
        name: "{{ .Release.Name }}-snmp-secret"
        globalMounts:
          - path: /etc/snmp-netalertx/snmp.conf
            subPath: snmp.conf
            readOnly: true
      tmp:
        type: emptyDir
