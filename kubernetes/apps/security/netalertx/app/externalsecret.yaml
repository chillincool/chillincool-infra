---
# yaml-language-server: $schema=https://kubernetes-schemas-cvg.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netalertx
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: netalertx-secret
    template:
      data:
        # Discover devices from the FortiGate ARP table (all VLANs) over SNMP.
        # Credentials come from snmp.conf (netalertx-snmp) so they never appear in the logged command.
        # The plugin reads the router IP from the 7th word of the command, so keep "-v 3 -l authPriv" in front of it.
        APP_CONF_OVERRIDE: |-
          {
            "SNMPDSC_RUN": "schedule",
            "SNMPDSC_RUN_SCHD": "*/5 * * * *",
            "SNMPDSC_RUN_TIMEOUT": 60,
            "SNMPDSC_routers": ["snmpwalk -v 3 -l authPriv -OXsq 172.16.60.1 .1.3.6.1.2.1.4.22.1.2"],
            "TIMEZONE": "America/Chicago"
          }
  dataFrom:
    - extract:
        key: netalertx
---
# yaml-language-server: $schema=https://kubernetes-schemas-cvg.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netalertx-snmp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: netalertx-snmp-secret
    template:
      data:
        snmp.conf: |
          defVersion 3
          defSecurityLevel authPriv
          defSecurityName {{ .SNMP_USER }}
          defAuthType SHA-256
          defAuthPassphrase {{ .SNMP_AUTH_PASS }}
          defPrivType AES
          defPrivPassphrase {{ .SNMP_PRIV_PASS }}
  dataFrom:
    - extract:
        key: netalertx
