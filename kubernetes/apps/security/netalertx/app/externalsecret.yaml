---
# yaml-language-server: $schema=https://kubernetes-schemas-cvg.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netalertx
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: netalertx-secret
    template:
      data:
        # Discover devices from the FortiGate ARP table (all VLANs) over SNMP
        APP_CONF_OVERRIDE: |-
          {
            "SNMPDSC_RUN": "schedule",
            "SNMPDSC_RUN_SCHD": "*/5 * * * *",
            "SNMPDSC_RUN_TIMEOUT": 60,
            "SNMPDSC_routers": ["snmpwalk -v 3 -l authPriv -u {{ .SNMP_USER }} -a SHA-256 -A {{ .SNMP_AUTH_PASS }} -x AES -X {{ .SNMP_PRIV_PASS }} -OXsq 172.16.60.1 .1.3.6.1.2.1.4.22.1.2"],
            "TIMEZONE": "America/Chicago"
          }
  dataFrom:
    - extract:
        key: netalertx
