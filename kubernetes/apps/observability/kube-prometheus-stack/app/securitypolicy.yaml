---
# yaml-language-server: $schema=https://kubernetes-schemas-cvg.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: prometheus-auth
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: kube-prometheus-stack-prometheus
  oidc:
    provider:
      issuer: https://login.chillincool.net/realms/chillincool
    clientID: prometheus
    clientSecret:
      name: prometheus-oidc-secret
    redirectURL: https://prometheus.chillincool.net/oauth2/callback
    forwardAccessToken: true
  jwt:
    providers:
      - name: keycloak
        issuer: https://login.chillincool.net/realms/chillincool
        remoteJWKS:
          uri: https://login.chillincool.net/realms/chillincool/protocol/openid-connect/certs
  authorization:
    defaultAction: Deny
    rules:
      - name: access
        action: Allow
        principal:
          jwt:
            provider: keycloak
            claims:
              - name: prometheus_roles
                valueType: StringArray
                values:
                  - access
---
# yaml-language-server: $schema=https://kubernetes-schemas-cvg.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
