---
# yaml-language-server: $schema=https://kubernetes-schemas-cvg.pages.dev/grafana.integreatly.org/grafana_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    grafana.internal/instance: grafana
spec:
  config:
    analytics:
      check_for_updates: "false"
      check_for_plugin_updates: "false"
      feedback_links_enabled: "false"
      reporting_enabled: "false"
    auth:
      disable_login_form: "false"
    auth.anonymous:
      enabled: "false"
    # Keycloak login. The grafana_roles claim carries the grafana client roles; strict mode
    # refuses anyone without one. The local admin login stays as break-glass.
    auth.generic_oauth:
      enabled: "true"
      name: Keycloak
      client_id: grafana
      scopes: openid email profile
      auth_url: https://login.chillincool.net/realms/chillincool/protocol/openid-connect/auth
      token_url: https://login.chillincool.net/realms/chillincool/protocol/openid-connect/token
      api_url: https://login.chillincool.net/realms/chillincool/protocol/openid-connect/userinfo
      signout_redirect_url: https://login.chillincool.net/realms/chillincool/protocol/openid-connect/logout?client_id=grafana
      use_pkce: "true"
      allow_sign_up: "true"
      login_attribute_path: preferred_username
      email_attribute_path: email
      name_attribute_path: name
      role_attribute_path: contains(grafana_roles || `[]`, 'admin') && 'GrafanaAdmin' || contains(grafana_roles || `[]`, 'viewer') && 'Viewer'
      role_attribute_strict: "true"
      allow_assign_grafana_admin: "true"
    log:
      mode: console
    metrics:
      enabled: "true"
    news:
      news_feed_enabled: "false"
    plugins:
      plugin_admin_enabled: "false"
    security:
      angular_support_enabled: "true"
    server:
      enable_gzip: "true"
      root_url: https://grafana.chillincool.net
  deployment:
    spec:
      strategy:
        type: Recreate
      template:
        spec:
          containers:
            - name: grafana
              env:
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin-password-secret
                      key: GF_SECURITY_ADMIN_PASSWORD
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin-password-secret
                      key: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          volumes:
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-pvc
  httpRoute:
    spec:
      hostnames:
        - grafana.chillincool.net
      parentRefs:
        - name: envoy-internal
          namespace: network
      rules:
        - backendRefs:
            - name: grafana-service
              port: 3000
  persistentVolumeClaim:
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
      storageClassName: longhorn
  disableDefaultSecurityContext: All

