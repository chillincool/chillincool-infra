---
# yaml-language-server: $schema=https://kubernetes-schemas-cvg.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: flux-operator-auth
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: flux-operator
  oidc:
    provider:
      issuer: https://login.chillincool.net/realms/chillincool
    clientID: flux-operator
    clientSecret:
      name: flux-operator-oidc-secret
    redirectURL: https://flux-operator.chillincool.net/oauth2/callback
    forwardAccessToken: true
  jwt:
    providers:
      - name: keycloak
        issuer: https://login.chillincool.net/realms/chillincool
        remoteJWKS:
          uri: https://login.chillincool.net/realms/chillincool/protocol/openid-connect/certs
  authorization:
    defaultAction: Deny
    rules:
      - name: access
        action: Allow
        principal:
          jwt:
            provider: keycloak
            claims:
              - name: flux-operator_roles
                valueType: StringArray
                values:
                  - access
