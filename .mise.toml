[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = "{{config_root}}/talosconfig"
JUST_UNSTABLE = "1"
LEFTHOOK_OUTPUT = "false"
# k9s: send skin colors as ANSI palette slots so it follows the terminal theme
TCELL_TRUECOLOR = "disable"

_.file = [
  "{{config_root}}/.secrets.env",
]
# kubectl plugins installed with krew (kubectl ctx, ns, stern, ...)
_.path = [
  "{{env.HOME}}/.krew/bin",
]

[tools]
"uv" = "0.13.7"
"pipx:flux-local" = "8.4.0"
"talosctl" = "1.14.5"
"kubectl" = "1.37.2"
"k9s" = "0.51.0"
"flux2" = "2.10.0"
"helm" = "4.3.1"
"helmfile" = "1.8.3"
